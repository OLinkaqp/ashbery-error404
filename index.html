<style>
  :root{
    --void:#03060c;
    --ink:#0a1220;
    --holo:#8fd8ff;
    --jade:#7ec8a9;
    --lotus:#7b7ce0;
    --lantern:#f0912f;
    --bone:#dfe8f2;
    --mono:"Share Tech Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--void); color:var(--bone);
    font-family:var(--mono);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }
  /* ambient room glow behind the frame */
  body::before{
    content:""; position:fixed; inset:-20%; pointer-events:none;
    background:
      radial-gradient(45% 35% at 50% 42%, rgba(60,120,190,.20), transparent 70%),
      radial-gradient(30% 25% at 78% 62%, rgba(240,145,47,.10), transparent 70%);
    filter:blur(20px);
  }

  .stage{
    position:relative;
    height:100dvh; aspect-ratio:714/1280;
    max-width:100vw;
    display:flex; align-items:center; justify-content:center;
  }
  .frame{
    position:relative; width:100%; height:100%;
    overflow:hidden;
    border-radius:14px;
    background:#000;
    box-shadow:
      0 0 0 1px rgba(143,216,255,.10),
      0 0 90px rgba(30,90,150,.28),
      inset 0 0 120px rgba(0,0,0,.9);
    cursor:crosshair;
    isolation:isolate;
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #fx{mix-blend-mode:screen; pointer-events:none}

  /* ---- CRT ---- */
  .crt,.grille,.scanbar,.curve,.edge{position:absolute; inset:0; pointer-events:none}
  .crt{
    background:repeating-linear-gradient(to bottom,
      rgba(0,0,0,.34) 0px, rgba(0,0,0,.34) 1px,
      rgba(0,0,0,0) 1px, rgba(0,0,0,0) 3px);
    opacity:.85; animation:flick 5.5s steps(30) infinite;
  }
  .grille{
    background:repeating-linear-gradient(to right,
      rgba(255,40,80,.055) 0px, rgba(255,40,80,.055) 1px,
      rgba(40,255,180,.045) 1px, rgba(40,255,180,.045) 2px,
      rgba(70,90,255,.055) 2px, rgba(70,90,255,.055) 3px);
    mix-blend-mode:screen;
  }
  .scanbar{
    background:linear-gradient(to bottom, transparent, rgba(180,225,255,.16) 42%, rgba(255,255,255,.30) 50%, rgba(180,225,255,.16) 58%, transparent);
    height:22%; top:-25%; mix-blend-mode:screen; opacity:.55;
    animation:sweep 7.5s cubic-bezier(.4,0,.6,1) infinite;
  }
  .curve{
    background:radial-gradient(115% 85% at 50% 50%, transparent 52%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.9) 100%);
    box-shadow:inset 0 0 60px rgba(0,0,0,.8);
  }
  .off .crt,.off .grille,.off .scanbar{opacity:0}
  @keyframes flick{0%,100%{opacity:.85}47%{opacity:.72}48%{opacity:.95}72%{opacity:.78}}
  @keyframes sweep{0%{top:-25%}100%{top:105%}}

  /* corner ticks */
  .edge span{position:absolute; width:18px; height:18px; border:1px solid rgba(143,216,255,.35)}
  .edge span:nth-child(1){top:10px;left:10px;border-right:0;border-bottom:0}
  .edge span:nth-child(2){top:10px;right:10px;border-left:0;border-bottom:0}
  .edge span:nth-child(3){bottom:10px;left:10px;border-right:0;border-top:0}
  .edge span:nth-child(4){bottom:10px;right:10px;border-left:0;border-top:0}

  /* ---- HUD log ---- */
  .log{
    position:absolute; left:14px; bottom:76px; z-index:4;
    font-size:clamp(8px,1.55vh,12px); line-height:1.55;
    color:rgba(190,232,255,.72); text-shadow:0 0 8px rgba(90,180,255,.55);
    pointer-events:none; letter-spacing:.04em; max-width:70%;
  }
  .log b{font-weight:400; color:rgba(255,120,120,.9); text-shadow:0 0 10px rgba(255,60,60,.5)}
  .caret{display:inline-block; width:.55em; height:1em; background:rgba(190,232,255,.8);
    vertical-align:-.12em; animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* ---- dock ---- */
  .dock{
    position:absolute; z-index:6; left:50%; bottom:14px; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:center;
    padding:8px 10px; border-radius:10px;
    background:rgba(4,10,18,.55); backdrop-filter:blur(9px);
    border:1px solid rgba(143,216,255,.16);
    opacity:.3; transition:opacity .35s ease; max-width:calc(100% - 20px);
  }
  .stage:hover .dock, .dock:focus-within, .dock.awake{opacity:1}
  .dock button{
    font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(214,238,255,.85); background:transparent;
    border:1px solid rgba(143,216,255,.25); border-radius:6px;
    padding:6px 9px; cursor:pointer; transition:.18s;
  }
  .dock button:hover{border-color:var(--holo); color:#fff; box-shadow:0 0 14px rgba(143,216,255,.28)}
  .dock button[aria-pressed="true"]{background:rgba(143,216,255,.14); border-color:rgba(143,216,255,.6); color:#fff}
  .dock button.warn{border-color:rgba(240,145,47,.45); color:#ffcf9d}
  .dock button.warn:hover{border-color:var(--lantern); box-shadow:0 0 14px rgba(240,145,47,.35)}
  .dock label{display:flex; align-items:center; gap:7px; font-size:10px; letter-spacing:.14em; color:rgba(214,238,255,.6)}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:88px; height:2px; background:rgba(143,216,255,.3); outline:none; border-radius:2px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:11px; height:11px; border-radius:50%;
    background:var(--holo); box-shadow:0 0 10px var(--holo); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--holo);box-shadow:0 0 10px var(--holo);cursor:pointer}

  .hint{
    position:absolute; z-index:5; left:50%; transform:translateX(-50%); bottom:60px;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(190,232,255,.45); pointer-events:none; white-space:nowrap;
    transition:opacity 1.2s ease;
  }
  .credit{
    position:absolute; z-index:5; top:50%; right:-46px; transform:rotate(90deg); transform-origin:center;
    font-family:var(--serif); font-size:13px; letter-spacing:.55em; color:rgba(223,232,242,.28); white-space:nowrap;
    pointer-events:none;
  }
  @media (max-width:900px){ .credit{display:none} }
  @media (prefers-reduced-motion:reduce){
    .scanbar,.crt{animation:none}
  }
</style>

  var frameEl = document.getElementById('frame');
  var cv  = document.getElementById('cv'),  ctx  = cv.getContext('2d');
  var fx  = document.getElementById('fx'),  fctx = fx.getContext('2d');
  var mk = function(){ return document.createElement('canvas'); };
  var scene = mk(), sctx = scene.getContext('2d');
  var glc   = mk(), gctx = glc.getContext('2d');
  var tmp   = mk(), tctx = tmp.getContext('2d');
  var chA   = mk(), actx = chA.getContext('2d');
  var chB   = mk(), bctx = chB.getContext('2d');
  var fgc   = mk(), fgx = fgc.getContext('2d');

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W=1,H=1,DPR=1, ready=false;
  var img = new Image();

  // ---------- state ----------
  var S = {
    amt: 0.38,          // user glitch level
    burst: 0,           // transient corruption
    lensOn: true,
    lensK: 0,           // 0..1 lens presence
    lx: 0.5, ly: 0.5,   // lens position, normalized
    tx: 0, ty: 0,       // target parallax  -1..1
    px: 0, py: 0,       // smoothed parallax
    lastInput: -1e9,
    black: 0,           // full-frame kill (reboot sequence)
    clean: 0            // forced clean window (reboot sequence)
  };

  // ---------- sizing ----------
  function resize(){
    var r = frameEl.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(2, Math.round(r.width  * DPR));
    H = Math.max(2, Math.round(r.height * DPR));
    [cv,fx,scene,glc,tmp,chA,chB].forEach(function(c){ c.width = W; c.height = H; });
    seedParticles();
  }
  window.addEventListener('resize', resize);

  // ---------- prebaked haze plate (cheap depth blur, built once) ----------
  var haze = mk(), hzx = haze.getContext('2d');
  function buildHaze(){
    var w = 220, h = Math.round(w * img.height / img.width);
    haze.width = w; haze.height = h;
    hzx.clearRect(0,0,w,h);
    hzx.filter = 'blur(5px) saturate(1.2) brightness(.82)';
    hzx.drawImage(img, 0, 0, w, h);
    hzx.filter = 'none';
  }

  // ---------- foreground plate (bottom water + lotuses, faded at top) ----------
  function buildForeground(){
    var cut = 0.60;                       // take bottom 40% of the artwork
    var sy = Math.round(img.height * cut);
    var sh = img.height - sy;
    fgc.width = img.width; fgc.height = sh;
    fgx.clearRect(0,0,fgc.width,fgc.height);
    fgx.drawImage(img, 0, sy, img.width, sh, 0, 0, img.width, sh);
    var g = fgx.createLinearGradient(0,0,0,sh);
    g.addColorStop(0,   'rgba(0,0,0,1)');
    g.addColorStop(0.42,'rgba(0,0,0,0.55)');
    g.addColorStop(0.72,'rgba(0,0,0,0)');
    fgx.globalCompositeOperation = 'destination-out';
    fgx.fillStyle = g; fgx.fillRect(0,0,fgc.width,sh);
    fgx.globalCompositeOperation = 'source-over';
  }

  // cover-fit rect with overscan + parallax offset
  function rectFor(scale, par, yBias){
    var ar = img.width / img.height;
    var w, h;
    if (W/H > ar){ w = W*scale; h = w/ar; } else { h = H*scale; w = h*ar; }
    var ox = -S.px * (W*0.045) * par;
    var oy = -S.py * (H*0.030) * par;
    return { x:(W-w)/2 + ox, y:(H-h)/2 + oy + (yBias||0), w:w, h:h };
  }

  // ---------- scene (parallax depth) ----------
  function drawScene(t){
    sctx.setTransform(1,0,0,1,0,0);
    sctx.globalCompositeOperation = 'source-over';
    sctx.globalAlpha = 1;
    sctx.fillStyle = '#03060c';
    sctx.fillRect(0,0,W,H);

    // 1. distant haze — slow parallax, blurred bleed = air behind the figure
    var rH = rectFor(1.22, 0.30);
    sctx.globalAlpha = .62;
    sctx.drawImage(haze, rH.x, rH.y, rH.w, rH.h);
    sctx.globalAlpha = 1;

    // 2. main plate — the artwork itself
    var rM = rectFor(1.05, 1.0);
    sctx.drawImage(img, rM.x, rM.y, rM.w, rM.h);

    // 3. foreground plate — water & lotuses ride closer to the viewer
    var rF = rectFor(1.16, 2.35, 0);
    var fh = rF.h * (fgc.height / img.height);
    var fy = rF.y + rF.h - fh;
    sctx.drawImage(fgc, rF.x, fy, rF.w, fh);

    // 4. lantern breathing + cold key light — additive, tied to the plate
    var flick = 0.72 + 0.28*Math.sin(t*0.0031) + 0.09*Math.sin(t*0.017);
    sctx.globalCompositeOperation = 'lighter';
    var lx = rM.x + rM.w*0.905, ly = rM.y + rM.h*0.598;
    var lg = sctx.createRadialGradient(lx,ly,0, lx,ly, Math.max(W,H)*0.20);
    lg.addColorStop(0,  'rgba(255,176,92,'+(0.30*flick)+')');
    lg.addColorStop(.35,'rgba(240,145,47,'+(0.11*flick)+')');
    lg.addColorStop(1,  'rgba(240,145,47,0)');
    sctx.fillStyle = lg; sctx.fillRect(0,0,W,H);

    var mx = rM.x + rM.w*0.5, my = rM.y + rM.h*0.30;
    var mg = sctx.createRadialGradient(mx,my,0, mx,my, Math.max(W,H)*0.34);
    mg.addColorStop(0,  'rgba(120,190,255,.085)');
    mg.addColorStop(1,  'rgba(120,190,255,0)');
    sctx.fillStyle = mg; sctx.fillRect(0,0,W,H);
    sctx.globalCompositeOperation = 'source-over';
  }

  // ---------- glitch engine ----------
  var glitchAt = 0, glitchReady = false;

  function tintChannel(c, cx, color){
    cx.setTransform(1,0,0,1,0,0);
    cx.globalCompositeOperation = 'source-over';
    cx.clearRect(0,0,W,H);
    cx.drawImage(scene,0,0);
    cx.globalCompositeOperation = 'multiply';
    cx.fillStyle = color; cx.fillRect(0,0,W,H);
    cx.globalCompositeOperation = 'source-over';
  }

  function buildGlitch(k){
    // k = 0..1 strength
    gctx.setTransform(1,0,0,1,0,0);
    gctx.globalCompositeOperation = 'source-over';
    gctx.globalAlpha = 1;
    gctx.clearRect(0,0,W,H);

    var split = (1.5 + 16*k*k) * DPR * (Math.random()<.25 ? 2.2 : 1);
    if (k > 0.06){
      tintChannel(chA, actx, '#ff2b44');
      tintChannel(chB, bctx, '#25ffff');
      gctx.globalCompositeOperation = 'lighter';
      gctx.drawImage(chA,  split, -split*0.12);
      gctx.drawImage(chB, -split,  split*0.12);
      gctx.globalCompositeOperation = 'source-over';
    } else {
      gctx.drawImage(scene,0,0);
    }

    // snapshot for self-referencing displacement
    tctx.setTransform(1,0,0,1,0,0);
    tctx.globalCompositeOperation='source-over';
    tctx.clearRect(0,0,W,H); tctx.drawImage(glc,0,0);

    // horizontal slice tearing
    var slices = Math.round(2 + 22*k);
    for (var i=0;i<slices;i++){
      var y = Math.random()*H;
      var h = Math.max(1, (Math.random()*Math.random()*0.10*H));
      var dx = (Math.random()-0.5) * (0.18*W) * (0.25 + k);
      gctx.drawImage(tmp, 0, y, W, h, dx, y + (Math.random()-0.5)*3*DPR, W, h);
    }

    // displaced blocks — "битые" данные
    var blocks = Math.round(1 + 10*k);
    for (var j=0;j<blocks;j++){
      var bw = (0.08 + Math.random()*0.42) * W;
      var bh = (0.006 + Math.random()*0.05) * H;
      var sx = Math.random()*(W-bw), sy2 = Math.random()*(H-bh);
      gctx.drawImage(tmp, sx, sy2, bw, bh,
        sx + (Math.random()-0.5)*0.30*W, sy2 + (Math.random()-0.5)*0.05*H, bw, bh);
    }

    // hot data lines
    gctx.globalCompositeOperation = 'lighter';
    var lines = Math.round(2 + 26*k);
    for (var m=0;m<lines;m++){
      var ly2 = Math.random()*H;
      var lw = Math.random()*W*0.6, lx2 = Math.random()*W;
      var col = Math.random()<.55 ? 'rgba(143,216,255,' : 'rgba(255,255,255,';
      gctx.fillStyle = col + (0.05 + Math.random()*0.30*k) + ')';
      gctx.fillRect(lx2, ly2, lw, Math.max(1, DPR*(Math.random()<.15?2:1)));
    }
    // dropout bands
    gctx.globalCompositeOperation = 'source-over';
    var drops = Math.round(6*k);
    for (var d=0; d<drops; d++){
      gctx.fillStyle = 'rgba(2,5,10,' + (0.25 + Math.random()*0.5) + ')';
      gctx.fillRect(0, Math.random()*H, W, Math.max(1, Math.random()*0.012*H));
    }
    glitchReady = true;
  }

  // ---------- particles ----------
  var motes = [], orbs = [], bits = [];
  function seedParticles(){
    var n = Math.round((W*H)/(46000*DPR));
    motes = []; orbs = []; bits = [];
    for (var i=0;i<n;i++){
      motes.push({ x:Math.random()*W, y:Math.random()*H,
        r:(0.5+Math.random()*1.5)*DPR, v:(0.06+Math.random()*0.35)*DPR,
        p:1.1+Math.random()*1.6, ph:Math.random()*6.28,
        c: Math.random()<.22 ? '255,205,150' : '160,215,255' });
    }
    for (var j=0;j<7;j++){
      orbs.push({ x:Math.random()*W, y:H*(0.72+Math.random()*0.28),
        r:(14+Math.random()*40)*DPR, ph:Math.random()*6.28,
        p:2.2+Math.random()*1.2, c: Math.random()<.5 ? '123,124,224' : '110,190,255' });
    }
    for (var k2=0;k2<26;k2++){
      bits.push({ x:Math.random()*W, y:Math.random()*H, s:(1+Math.random()*3)*DPR, ph:Math.random()*100 });
    }
  }
  function drawParticles(t){
    fctx.setTransform(1,0,0,1,0,0);
    fctx.clearRect(0,0,W,H);
    fctx.globalCompositeOperation = 'lighter';

    for (var j=0;j<orbs.length;j++){
      var o = orbs[j];
      var ox = o.x - S.px*(W*0.045)*o.p, oy = o.y - S.py*(H*0.030)*o.p;
      var pul = 0.55 + 0.45*Math.sin(t*0.0009 + o.ph);
      var g = fctx.createRadialGradient(ox,oy,0, ox,oy,o.r);
      g.addColorStop(0,'rgba('+o.c+','+(0.20*pul)+')');
      g.addColorStop(1,'rgba('+o.c+',0)');
      fctx.fillStyle = g;
      fctx.beginPath(); fctx.arc(ox,oy,o.r,0,6.2832); fctx.fill();
    }

    for (var i=0;i<motes.length;i++){
      var m = motes[i];
      m.y -= m.v; if (m.y < -6) { m.y = H + 6; m.x = Math.random()*W; }
      var mx = m.x - S.px*(W*0.045)*m.p + Math.sin(t*0.0006 + m.ph)*3*DPR;
      var my = m.y - S.py*(H*0.030)*m.p;
      var a = 0.18 + 0.42*Math.abs(Math.sin(t*0.0013 + m.ph));
      fctx.fillStyle = 'rgba('+m.c+','+a+')';
      fctx.beginPath(); fctx.arc(mx,my,m.r,0,6.2832); fctx.fill();
    }

    var strength = level();
    if (strength > 0.05){
      for (var b=0;b<bits.length;b++){
        var bt = bits[b];
        if (Math.random() < 0.04 + strength*0.16){
          bt.x = Math.random()*W; bt.y = Math.random()*H;
        }
        if (Math.random() < 0.35){
          fctx.fillStyle = 'rgba(143,216,255,'+(0.25+Math.random()*0.5*strength)+')';
          fctx.fillRect(bt.x, bt.y, bt.s*(1+Math.random()*4), bt.s);
        }
      }
    }
    fctx.globalCompositeOperation = 'source-over';
  }

  // ---------- composite ----------
  function level(){
    var v = S.amt*0.85 + S.burst;
    if (S.clean > 0) v *= (1 - S.clean);
    return Math.max(0, Math.min(1, v));
  }

  function render(t){
    drawScene(t);

    ctx.setTransform(1,0,0,1,0,0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.clearRect(0,0,W,H);
    ctx.drawImage(scene,0,0);

    var k = level();
    if (k > 0.004 && !reduced){
      var interval = 30 + 90*(1-k);
      if (t - glitchAt > interval || Math.random() < 0.02*k){
        buildGlitch(k); glitchAt = t;
      }
      if (glitchReady){
        var lensR = Math.min(W,H) * (0.20 + 0.06*Math.sin(t*0.002));
        var cutting = S.lensOn && S.lensK > 0.02;
        ctx.save();
        ctx.globalAlpha = Math.min(1, 0.35 + 0.65*k);
        if (cutting){
          var px = S.lx*W, py = S.ly*H;
          var r = lensR * S.lensK;
          var path = new Path2D();
          path.rect(0,0,W,H);
          path.arc(px,py,r,0,6.2832,true);   // counter-clockwise → hole
          ctx.clip(path);
          ctx.drawImage(glc,0,0);
          ctx.restore();
          // probe ring
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          var rg = ctx.createRadialGradient(px,py,r*0.72, px,py,r);
          rg.addColorStop(0,'rgba(143,216,255,0)');
          rg.addColorStop(1,'rgba(143,216,255,'+(0.14*S.lensK)+')');
          ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(px,py,r,0,6.2832); ctx.fill();
          ctx.strokeStyle = 'rgba(180,232,255,'+(0.55*S.lensK)+')';
          ctx.lineWidth = 1*DPR;
          ctx.beginPath(); ctx.arc(px,py,r,0,6.2832); ctx.stroke();
          ctx.strokeStyle = 'rgba(143,216,255,'+(0.35*S.lensK)+')';
          for (var a2=0;a2<4;a2++){
            var an = a2*Math.PI/2 + t*0.0004;
            ctx.beginPath();
            ctx.moveTo(px+Math.cos(an)*(r-7*DPR), py+Math.sin(an)*(r-7*DPR));
            ctx.lineTo(px+Math.cos(an)*(r+7*DPR), py+Math.sin(an)*(r+7*DPR));
            ctx.stroke();
          }
          ctx.restore();
        } else {
          ctx.drawImage(glc,0,0);
          ctx.restore();
        }
      }
      // rare whole-frame jolt
      if (Math.random() < 0.004 + 0.02*k){
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(150,200,255,'+(0.03+0.07*k)+')';
        ctx.fillRect(0,0,W,H);
        ctx.restore();
      }
    }

    if (S.black > 0){
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,'+Math.min(1,S.black)+')';
      ctx.fillRect(0,0,W,H);
      if (S.black > 0.4){
        for (var n=0;n<220;n++){
          ctx.fillStyle = 'rgba(255,255,255,'+(Math.random()*0.16)+')';
          ctx.fillRect(Math.random()*W, Math.random()*H, Math.random()*40*DPR, DPR);
        }
      }
      ctx.restore();
    }

    drawParticles(t);
  }

  // ---------- loop ----------
  var last = 0;
  function loop(t){
    requestAnimationFrame(loop);
    if (!ready) return;
    var dt = Math.min(64, t - last); last = t;

    // ambient drift when idle
    if (t - S.lastInput > 2200){
      S.tx = Math.sin(t*0.00021) * 0.55;
      S.ty = Math.cos(t*0.00016) * 0.40;
    }
    var e = 1 - Math.pow(0.001, dt/1000);
    S.px += (S.tx - S.px) * e * 0.8;
    S.py += (S.ty - S.py) * e * 0.8;

    var wantLens = (S.lensOn && (t - S.lastInput < 2600)) ? 1 : 0;
    S.lensK += (wantLens - S.lensK) * (dt/220);
    S.burst  = Math.max(0, S.burst - dt/900);
    S.black  = Math.max(0, S.black - dt/420);
    S.clean  = Math.max(0, S.clean - dt/2600);

    render(t);
  }

  // ---------- input ----------
  function pointFrom(clientX, clientY){
    var r = frameEl.getBoundingClientRect();
    var nx = (clientX - r.left) / r.width;
    var ny = (clientY - r.top)  / r.height;
    S.lx = nx; S.ly = ny;
    S.tx = (nx - .5) * 2;
    S.ty = (ny - .5) * 2;
    S.lastInput = performance.now();
    fadeHint();
  }
  frameEl.addEventListener('pointermove', function(ev){ pointFrom(ev.clientX, ev.clientY); });
  frameEl.addEventListener('pointerleave', function(){ S.lastInput = performance.now() - 2400; });
  frameEl.addEventListener('pointerdown', function(ev){
    pointFrom(ev.clientX, ev.clientY);
    S.burst = 0.75; pushLine('> SIGNAL DISRUPTED @ ' + Math.round(S.lx*100) + '/' + Math.round(S.ly*100));
  });
  window.addEventListener('deviceorientation', function(ev){
    if (ev.gamma == null) return;
    S.tx = Math.max(-1, Math.min(1, ev.gamma/28));
    S.ty = Math.max(-1, Math.min(1, ((ev.beta||45)-45)/34));
    S.lastInput = performance.now();
  });

  // ---------- controls ----------
  var dock = document.getElementById('dock');
  var amt = document.getElementById('amt');
  amt.addEventListener('input', function(){ S.amt = amt.value/100; });
  var bCrt = document.getElementById('bCrt');
  bCrt.addEventListener('click', function(){
    var on = bCrt.getAttribute('aria-pressed') === 'true';
    bCrt.setAttribute('aria-pressed', String(!on));
    frameEl.classList.toggle('off', on);
  });
  var bLens = document.getElementById('bLens');
  bLens.addEventListener('click', function(){
    S.lensOn = !S.lensOn;
    bLens.setAttribute('aria-pressed', String(S.lensOn));
  });
  document.getElementById('bFull').addEventListener('click', function(){
    var el = document.getElementById('stage');
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) { var p = el.requestFullscreen(); if (p && p.catch) p.catch(function(){}); }
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e){}
    setTimeout(resize, 250);
  });
  document.getElementById('bRestore').addEventListener('click', restore);

  window.addEventListener('keydown', function(ev){
    var k = ev.key.toLowerCase();
    if (k === 'g'){ S.burst = 1; }
    if (k === 'r'){ restore(); }
    if (k === 'c'){ bCrt.click(); }
    if (k === 'f'){ document.getElementById('bFull').click(); }
    if (k === 'g' || k === 'r'){ dock.classList.add('awake'); }
  });

  function restore(){
    S.burst = 1.2;
    pushLine('> RESTORING THREAD 0x1F4C…');
    setTimeout(function(){ S.black = 1; }, 520);
    setTimeout(function(){
      S.clean = 1; S.burst = 0;
      pushLine('> INTEGRITY CHECK … 0%');
    }, 900);
    setTimeout(function(){ pushLine('<b>> RESTORE FAILED — 404_NOT_FOUND</b>'); }, 2000);
  }

  // ---------- HUD log ----------
  var logEl = document.getElementById('log');
  var lines = [
    '> scanning thread 0x1F4C…',
    '> character_id: [REDACTED]',
    '> integrity: 12% · frames lost: 404',
    '> destiny_rewritten = TRUE',
    '<b>> thread terminated</b>'
  ];
  var out = [], evt = [], li = 0, ci = 0;
  function paint(){
    logEl.innerHTML = out.concat(evt).join('<br>') + '<span class="caret"></span>';
  }
  function type(){
    if (li >= lines.length){
      setTimeout(function(){ out = []; li = 0; ci = 0; paint(); type(); }, 4200);
      return;
    }
    var src = lines[li];
    var bold = src.indexOf('<b>') === 0;
    var plain = src.replace(/<\/?b>/g, '');
    ci++;
    var partial = plain.slice(0, ci);
    out[li] = bold ? '<b>' + partial + '</b>' : partial;
    paint();
    if (ci >= plain.length){ li++; ci = 0; setTimeout(type, 620); }
    else setTimeout(type, 26 + Math.random()*40);
  }
  function pushLine(txt){
    evt.push(txt); if (evt.length > 3) evt.shift();
    paint();
  }

  // ---------- hint ----------
  var hintEl = document.getElementById('hint'), hinted = false;
  function fadeHint(){
    if (hinted) return; hinted = true;
    setTimeout(function(){ hintEl.style.opacity = '0'; }, 1200);
  }
  setTimeout(fadeHint, 7000);

  // ---------- boot ----------
  img.onload = function(){
    buildHaze();
    buildForeground();
    resize();
    ready = true;
    S.burst = 1;
    type();
    requestAnimationFrame(loop);
  };
  img.src = IMG_SRC;
})();
</script>
</body>
</html>
